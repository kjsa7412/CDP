# CDP 서버 — compose 한 장. 서버 산출물 폴더(cdp-server-v<버전>/)에서:
#
#     docker compose -f deploy/docker-compose.yml up -d --build
#     docker compose -f deploy/docker-compose.yml logs cdp     ← 첫 관리자 코드 → 브라우저 http://<호스트>:7374/setup
#
# 명부(auth.json) · git 자격은 data 볼륨 안이다 — 새 판 폴더에서 올려도 이름 붙은 볼륨이 이어진다(-p 로 프로젝트 이름을 고정하면 확실하다:
#     docker compose -p cdp -f deploy/docker-compose.yml up -d --build).
# 셸로 첫 관리자를 만들려면 — docker compose exec cdp node bin/ctx.mjs serve init --auth /opt/cdp/data/auth.json --data /opt/cdp/data --name <이름>
services:
  cdp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cdp-server
    container_name: cdp
    restart: unless-stopped
    ports:
      - '7374:7374'
    volumes:
      - repos:/opt/cdp/repos
      - data:/opt/cdp/data

volumes:
  repos:
  data:
