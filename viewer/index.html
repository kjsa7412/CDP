<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>CDP</title>
    <!-- 첫 페인트 전 테마 · 얼굴 — CSS · 모듈보다 먼저 돈다(화면 · 권한 검토 v0.1 R9). 서버는 <head> 첫 줄에
         window.__CDP_SERVER__ 를 심는다. 계산은 api.js 의 applyTheme 과 같다(cdp.theme + OS). 전에는 테마가 CSS 뒤 ·
         스크립트 뒤에 붙어 어두운 테마 사용자도 첫 프레임이 늘 밝았다(P10). -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('cdp.theme') } catch (e) {}
        var d = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var r = document.documentElement
        r.dataset.theme = d ? 'dark' : 'light'
        var m = document.querySelector('meta[name="color-scheme"]')
        if (m) m.content = d ? 'dark' : 'light'
        var s = location.pathname.split('/').filter(Boolean)
        r.dataset.face = s[0] === 'r' && s[1] ? 'repo' : window.__CDP_SERVER__ ? (s[0] === 'console' ? 'console' : 'site') : 'local'
      })()
    </script>
    <!-- 스타일시트가 오기 전의 캔버스 — tokens.css 의 --bg 두 값과 같다 -->
    <style>
      html { background: #f6f7f9 }
      html[data-theme='dark'] { background: #0e1116 }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
