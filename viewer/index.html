<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>CDP</title>
    <!-- 첫 페인트 전 테마 · 얼굴 · 왼쪽 메뉴 접힘 — CSS · 모듈보다 먼저 돈다(화면 · 권한 검토 v0.1 R9). 계산은 api.js 의
         applyTheme 과 같다(cdp.theme + OS). 전에는 테마가 CSS 뒤 · 스크립트 뒤에 붙어 어두운 테마 사용자도 첫 프레임이 늘 밝았다(P10).
         얼굴은 주소 하나로 — routes.js 의 faceOf 와 같다(레포 /r/<레포>/ · 콘솔 /console · 나머지 사이트). 로컬 얼굴은 v1.0 에 없앴다.
         data-nav — 왼쪽 메뉴 펼침(open · 232px) · 접힘(rail · 56px). 사람이 정한 값(cdp.nav)이 없으면 1100px 이하는 접어서 연다
         (좌측 메뉴 셸 설계 L4 · 개편안 §7.2). 화면 전환으로는 바꾸지 않는다 — 사람이 정한 상태를 화면이 바꾸지 않는다. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('cdp.theme') } catch (e) {}
        var d = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var r = document.documentElement
        r.dataset.theme = d ? 'dark' : 'light'
        var m = document.querySelector('meta[name="color-scheme"]')
        if (m) m.content = d ? 'dark' : 'light'
        var s = location.pathname.split('/').filter(Boolean)
        r.dataset.face = s[0] === 'r' && s[1] ? 'repo' : s[0] === 'console' ? 'console' : 'site'
        var n = null
        try { n = localStorage.getItem('cdp.nav') } catch (e) {}
        r.dataset.nav = n === 'rail' || n === 'open' ? n : window.innerWidth <= 1100 ? 'rail' : 'open'
      })()
    </script>
    <!-- 스타일시트가 오기 전의 캔버스 — tokens.css 의 --bg 두 값과 같다 -->
    <style>
      html { background: #f6f7f9 }
      html[data-theme='dark'] { background: #0e1116 }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
