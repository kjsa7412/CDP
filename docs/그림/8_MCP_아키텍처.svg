<svg xmlns="http://www.w3.org/2000/svg" width="780" height="580" viewBox="0 0 780 580" role="img">
<title>CDP 시스템 아키텍처 — core 하나, 소비자 셋</title>
<desc>터미널·브라우저·MCP 호스트가 각각 ctx CLI·관리 서비스·ctx-mcp 를 부르고, 셋 모두 같은 core 를 통해 지식 레포의 git 을 읽고 쓴다. 모드 B 에서는 관리 서비스와 ctx serve 가 한 프로세스 한 포트로 돈다. 권한은 git 밖의 auth.json 명부가 매 요청 판정한다.</desc>
<style>
text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.dash{stroke:#888780;stroke-width:1.2;fill:none;stroke-dasharray:5 3}
.zone{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 3}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}
.purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}
.white{fill:#FFFFFF;stroke:#B4B2A9;stroke-width:0.5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="780" height="580" fill="#FFFFFF"/>

<text class="th" x="46" y="30" dominant-baseline="central" fill="#2C2C2A">CDP 시스템 아키텍처 — core 하나, 소비자 셋</text>

<!-- 부르는 쪽 -->
<rect class="gray" x="46" y="60" width="200" height="56" rx="8"/>
<text class="th" x="146" y="79" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">터미널 · git 훅</text>
<text class="ts" x="146" y="97" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">ctx 명령 · pre-commit</text>

<rect class="gray" x="266" y="60" width="180" height="56" rx="8"/>
<text class="th" x="356" y="79" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">브라우저</text>
<text class="ts" x="356" y="97" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">사람이 읽는다</text>

<rect class="gray" x="466" y="60" width="250" height="56" rx="8"/>
<text class="th" x="591" y="79" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Claude Code · Desktop · claude.ai</text>
<text class="ts" x="591" y="97" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">모델이 명함을 보고 고른다 · 스킬 cdp-*</text>

<line x1="146" y1="116" x2="146" y2="148" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="154" y="132" dominant-baseline="central" fill="#5F5E5A">실행</text>
<line x1="356" y1="116" x2="356" y2="148" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="364" y="132" dominant-baseline="central" fill="#5F5E5A">HTTP · 세션 쿠키</text>
<line x1="591" y1="116" x2="591" y2="148" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="599" y="132" dominant-baseline="central" fill="#5F5E5A">stdio · Streamable HTTP</text>

<!-- 모드 B 동거 -->
<rect class="zone" x="256" y="140" width="480" height="94" rx="12"/>
<text class="ts" x="726" y="226" text-anchor="end" dominant-baseline="central" fill="#5F5E5A">모드 B — 한 프로세스 · 한 포트</text>

<!-- 소비자 셋 -->
<rect class="white" x="46" y="150" width="200" height="70" rx="8"/>
<text class="th" x="146" y="172" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">ctx CLI</text>
<text class="ts" x="146" y="192" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">where · check · setup</text>

<rect class="white" x="266" y="150" width="180" height="70" rx="8"/>
<text class="th" x="356" y="172" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">관리 서비스</text>
<text class="ts" x="356" y="190" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">원격 · 설치 관리</text>
<text class="ts" x="356" y="207" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">쿠키 → 명부</text>

<rect class="white" x="466" y="150" width="250" height="70" rx="8"/>
<text class="th" x="591" y="170" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">ctx-mcp</text>
<text class="ts" x="591" y="188" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">ctx mcp (stdio) · ctx serve (HTTP)</text>
<text class="ts" x="591" y="205" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">읽기 12종 + save · repo 로 고른다</text>

<line x1="146" y1="220" x2="146" y2="252" class="arr" marker-end="url(#arrow)"/>
<line x1="356" y1="234" x2="356" y2="252" class="arr" marker-end="url(#arrow)"/>
<line x1="591" y1="234" x2="591" y2="252" class="arr" marker-end="url(#arrow)"/>

<!-- core -->
<rect class="purple" x="46" y="254" width="670" height="64" rx="8"/>
<text class="th" x="381" y="276" text-anchor="middle" dominant-baseline="central" fill="#3C3489">core/ — 판정 · 스캔 · 어휘 · 등록부 · 검증 · git</text>
<text class="ts" x="381" y="297" text-anchor="middle" dominant-baseline="central" fill="#534AB7">소비자 셋이 같은 함수를 부른다. 판정은 여기 한 곳에만 있다</text>

<line x1="236" y1="318" x2="236" y2="350" class="arr" marker-end="url(#arrow)"/>

<!-- 데이터 -->
<rect class="teal" x="46" y="352" width="380" height="76" rx="8"/>
<text class="th" x="236" y="374" text-anchor="middle" dominant-baseline="central" fill="#085041">지식 레포 N — git 작업 트리</text>
<text class="ts" x="236" y="394" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">관리 문서 · 작업 기록 · _vocab · _managed</text>
<text class="ts" x="236" y="412" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">고르는 것이지 합치는 것이 아니다</text>

<rect class="white" x="466" y="352" width="250" height="76" rx="8"/>
<text class="th" x="591" y="374" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">auth.json — 명부</text>
<text class="ts" x="591" y="394" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">users[] 권한 · tokens[] 신원</text>
<text class="ts" x="591" y="412" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">git 밖의 상태 — 여기와 설치 대장뿐</text>

<path class="dash" d="M716 390 H748 V186 H720" marker-end="url(#arrow)"/>
<text class="ts" transform="rotate(-90 762 288)" x="762" y="288" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">권한 판정 — 매 요청</text>

<line x1="236" y1="428" x2="236" y2="460" class="arr" marker-end="url(#arrow)"/>
<rect class="white" x="46" y="462" width="380" height="50" rx="8"/>
<text class="th" x="236" y="478" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">git origin</text>
<text class="ts" x="236" y="497" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">모드 A: 사람이 pull · push · 모드 B: 서버가 미러</text>

<text class="ts" x="46" y="544" dominant-baseline="central" fill="#5F5E5A">정본은 git 이다 — MCP 도 관리 서비스도 그 위에 낸 통로다 · 권한의 근거는 명부뿐 · 전송은 호스트의 사정이지 모델의 사정이 아니다</text>
</svg>
