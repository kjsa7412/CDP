<rect class="teal" x="236" y="232" width="184" height="52" rx="8"/><text class="th" x="328" y="250" text-anchor="middle" dominant-baseline="central" fill="#085041">커뮤니티 서버 · 내 것</text><text class="ts" x="328" y="268" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">내 PC · npx 로 받는다</text>
<text class="ts" x="448" y="244" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">HTTPS</text>
