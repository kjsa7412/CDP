<rect class="gray" x="476" y="232" width="144" height="52" rx="8"/><text class="th" x="548" y="250" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">벤더 REST API</text><text class="ts" x="548" y="268" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">토큰으로 호출</text>

<rect class="row" x="40" y="312" width="600" height="104" rx="12"/>
<text class="th" x="56" y="332" dominant-baseline="central" fill="#2C2C2A">③ 내 시스템에 REST API 가 있다 — data_admin</text>
<rect class="gray" x="60" y="350" width="120" height="52" rx="8"/><text class="th" x="120" y="368" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Claude Code</text><text class="ts" x="120" y="386" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">설정 한 줄</text>
<text class="ts" x="208" y="362" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">stdio</text>
<line x1="184" y1="376" x2="226" y2="376" class="arr" marker-end="url(#arrow)"/>
<rect class="purple" x="236" y="350" width="184" height="52" rx="8"/><text class="th" x="328" y="368" text-anchor="middle" dominant-baseline="central" fill="#3C3489">ezipez-ops</text><text class="ts" x="328" y="386" text-anchor="middle" dominant-baseline="central" fill="#534AB7">내 PC · 얇은 프록시</text>
