<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img">
<title>상황별 MCP 서버 — 누가 만들고 어디서 도나</title>
<desc>다섯 상황마다 호스트, MCP 서버, 실제 시스템을 왼쪽에서 오른쪽으로 배치했다. 보라색은 내가 만드는 서버, 청록색은 남이 만들어 둔 서버, 회색은 이미 있는 것이다. 화살표 위 글자는 전송 방식이다.</desc>
<style>
text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.row{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 3}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}
.purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="680" fill="#FFFFFF"/>

<rect class="purple" x="40" y="37" width="14" height="14" rx="3"/><text class="ts" x="60" y="44" dominant-baseline="central" fill="#444441">내가 만든다</text>
<rect class="teal" x="180" y="37" width="14" height="14" rx="3"/><text class="ts" x="200" y="44" dominant-baseline="central" fill="#444441">남이 만들어 둔 것 — 받기만</text>
<rect class="gray" x="400" y="37" width="14" height="14" rx="3"/><text class="ts" x="420" y="44" dominant-baseline="central" fill="#444441">이미 있는 것 · 호스트</text>

<rect class="row" x="40" y="76" width="600" height="104" rx="12"/>
<text class="th" x="56" y="96" dominant-baseline="central" fill="#2C2C2A">① SaaS 가 MCP 를 제공한다 — Slack · GitHub · Notion</text>
<rect class="gray" x="60" y="114" width="120" height="52" rx="8"/><text class="th" x="120" y="132" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Claude Code</text><text class="ts" x="120" y="150" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">설정 한 줄</text>
<text class="ts" x="208" y="126" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">HTTPS</text>
<line x1="184" y1="140" x2="226" y2="140" class="arr" marker-end="url(#arrow)"/>
<rect class="teal" x="236" y="114" width="184" height="52" rx="8"/><text class="th" x="328" y="132" text-anchor="middle" dominant-baseline="central" fill="#085041">벤더의 MCP 서버</text><text class="ts" x="328" y="150" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">벤더 인프라 · 코드 0</text>
<text class="ts" x="448" y="126" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">API</text>
<line x1="424" y1="140" x2="466" y2="140" class="arr" marker-end="url(#arrow)"/>
<rect class="gray" x="476" y="114" width="144" height="52" rx="8"/><text class="th" x="548" y="132" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Slack · GitHub</text><text class="ts" x="548" y="150" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">그쪽 DB</text>

<rect class="row" x="40" y="194" width="600" height="104" rx="12"/>
<text class="th" x="56" y="214" dominant-baseline="central" fill="#2C2C2A">② SaaS 에 REST API 만 있다</text>
