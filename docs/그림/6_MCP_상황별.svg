<rect class="row" x="40" y="430" width="600" height="104" rx="12"/>
<text class="th" x="56" y="450" dominant-baseline="central" fill="#2C2C2A">④ API 가 없다 — 함수 · 파일 뿐 (ctx)</text>
<rect class="gray" x="60" y="468" width="120" height="52" rx="8"/><text class="th" x="120" y="486" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Claude Code</text><text class="ts" x="120" y="504" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">설정 한 줄</text>
<text class="ts" x="208" y="480" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">stdio</text>
<line x1="184" y1="494" x2="226" y2="494" class="arr" marker-end="url(#arrow)"/>
<rect class="purple" x="236" y="468" width="184" height="52" rx="8"/><text class="th" x="328" y="486" text-anchor="middle" dominant-baseline="central" fill="#3C3489">ctx mcp</text><text class="ts" x="328" y="504" text-anchor="middle" dominant-baseline="central" fill="#534AB7">내 PC · core/ 직접 호출</text>
<text class="ts" x="448" y="480" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">함수</text>
<line x1="424" y1="494" x2="466" y2="494" class="arr" marker-end="url(#arrow)"/>
<rect class="gray" x="476" y="468" width="144" height="52" rx="8"/><text class="th" x="548" y="486" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">지식 레포</text><text class="ts" x="548" y="504" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">docs · work</text>

<rect class="row" x="40" y="548" width="600" height="104" rx="12"/>
<text class="th" x="56" y="568" dominant-baseline="central" fill="#2C2C2A">⑤ 밖에 내놓는다 — 진짜 서버</text>
<rect class="gray" x="60" y="586" width="120" height="52" rx="8"/><text class="th" x="120" y="604" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">남의 호스트</text><text class="ts" x="120" y="622" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">외부 AI 대화창</text>
<text class="ts" x="208" y="598" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">HTTPS</text>
<line x1="184" y1="612" x2="226" y2="612" class="arr" marker-end="url(#arrow)"/>
<rect class="purple" x="236" y="586" width="184" height="52" rx="8"/><text class="th" x="328" y="604" text-anchor="middle" dominant-baseline="central" fill="#3C3489">내 MCP 서버</text><text class="ts" x="328" y="622" text-anchor="middle" dominant-baseline="central" fill="#534AB7">내 인프라 · 인증 · TLS</text>
