<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img">
<title>CDP 세 레포 구조 — 소스 · 지식 · 작업</title>
<desc>CDP 소스 레포가 서버 산출물을 만든다. 서버가 지식 레포를 들고 save 하나로 쓰며 역할별 스킬과 서식집을 낸다. 설치 한 줄이 토큰의 역할로 작업 레포와 큐레이터 폴더에 스킬 · 규약 블록 · MCP 연결을 넣는다. 지식 레포에는 지식만 있다.</desc>
<style>
text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="520" fill="#FFFFFF"/>

<rect x="40" y="30" width="600" height="114" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="60" y="54" fill="#444441">CDP 소스 레포 — 우리가 고치는 것</text>
<text class="ts" x="60" y="72" fill="#5F5E5A">도구 개발자만 연다 · 산출물 둘(서버 tar · 사이트)을 낸다</text>

<rect x="60" y="84" width="176" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="148" y="98" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">agent/</text>
<text class="ts" x="148" y="116" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">스킬 · 블록 · 서식집</text>

<rect x="252" y="84" width="176" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="98" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">core/ · viewer/</text>
<text class="ts" x="340" y="116" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">판정 · 서버 · 화면</text>

<rect x="444" y="84" width="176" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="532" y="98" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">manual/ · ops/</text>
<text class="ts" x="532" y="116" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">설명서 · 배포 스크립트</text>

<line x1="340" y1="144" x2="340" y2="196" class="arr" marker-end="url(#arrow)"/>
<rect x="360" y="152" width="250" height="32" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="485" y="168" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">release:server → install.sh · upgrade.sh</text>

<rect x="40" y="206" width="600" height="114" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="60" y="230" fill="#085041">서버 — 지식 레포를 든다</text>
<text class="ts" x="60" y="248" fill="#0F6E56">쓰는 길은 save 하나 · 한 save 가 한 커밋 · origin 으로 미러</text>

<rect x="60" y="260" width="176" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="148" y="274" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">지식 레포 N</text>
<text class="ts" x="148" y="292" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">지식만 — work · docs · 어휘</text>

<rect x="252" y="260" width="176" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="274" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">kit/ · forms/</text>
<text class="ts" x="340" y="292" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">역할별 스킬 · 서식집</text>

<rect x="444" y="260" width="176" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="532" y="274" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">명부</text>
<text class="ts" x="532" y="292" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">역할 · 큐레이터 · 토큰</text>

<line x1="340" y1="320" x2="340" y2="372" class="arr" marker-end="url(#arrow)"/>
<rect x="360" y="328" width="250" height="32" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="485" y="344" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">설치 한 줄 — 토큰의 역할로 kit</text>

<rect x="40" y="382" width="600" height="114" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="60" y="406" fill="#3C3489">작업 레포 · 큐레이터 폴더 — Claude Code 가 도는 자리</text>
<text class="ts" x="60" y="424" fill="#534AB7">writer 는 기록만 남기고 · 큐레이터는 기록을 관리 문서에 반영한다</text>

<rect x="60" y="436" width="176" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="148" y="450" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">작업 레포</text>
<text class="ts" x="148" y="468" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">스킬 셋 · 코드가 있는 곳</text>

<rect x="252" y="436" width="176" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="450" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">큐레이터 폴더</text>
<text class="ts" x="340" y="468" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">스킬 다섯 · 레포마다</text>

<rect x="444" y="436" width="176" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="532" y="450" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">.mcp.json</text>
<text class="ts" x="532" y="468" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">/mcp/&lt;레포&gt; · 토큰</text>
</svg>
