<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img">
<title>ctx 빌드 경로</title>
<desc>ctx-cli.mjs 와 server/core 와 껍데기 스크립트를 두 빌더가 각각 번들해 bin/ctx.mjs 와 cdp.exe 를 만든다.</desc>
<style>
text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="300" fill="#FFFFFF"/>

<rect x="40" y="30" width="186" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="133" y="50" text-anchor="middle" dominant-baseline="central" fill="#444441">ctx-cli.mjs</text>
<text class="ts" x="133" y="68" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">진입 · 명령 11개</text>

<rect x="246" y="30" width="188" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central" fill="#444441">server/core/</text>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">계산 - 앱과 공유</text>

<rect x="454" y="30" width="186" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="547" y="50" text-anchor="middle" dominant-baseline="central" fill="#444441">bin/ctx · ctx.cmd</text>
<text class="ts" x="547" y="68" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">실행기 껍데기</text>

<path d="M133 86 L133 100 L547 100 L547 86" class="arr"/>
<line x1="340" y1="86" x2="340" y2="100" class="arr"/>
<line x1="185" y1="100" x2="185" y2="116" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="100" x2="495" y2="116" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="126" width="290" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="185" y="146" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">ops/lib/build-ctx.mjs</text>
<text class="ts" x="185" y="164" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">esbuild · ESM 단일 파일</text>

<rect x="350" y="126" width="290" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="495" y="146" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">ops/lib/build-exe.mjs</text>
<text class="ts" x="495" y="164" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Node SEA · 네이티브 모듈 0</text>

<line x1="185" y1="182" x2="185" y2="212" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="182" x2="495" y2="212" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="222" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="185" y="242" text-anchor="middle" dominant-baseline="central" fill="#085041">bin/ctx.mjs + 껍데기 둘</text>
<text class="ts" x="185" y="260" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">지식 레포 안으로 들어간다</text>

<rect x="350" y="222" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="495" y="242" text-anchor="middle" dominant-baseline="central" fill="#085041">tools/cdp.exe</text>
<text class="ts" x="495" y="260" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">앱 + ctx 가 한 파일</text>
</svg>
