<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img">
<title>CDP MCP 한 길 — 역할이 도구를 가른다</title>
<desc>작업 레포와 큐레이터 폴더의 Claude Code 는 HTTP 와 토큰으로, 브라우저는 세션 쿠키로 같은 서버 한 프로세스에 붙는다. 서버는 요청마다 역할로 도구를 등록한다 — 읽기 아홉과 save 는 모두, queue 와 forms 는 큐레이터에게만. 판정은 core 한 곳이고, 지식 레포는 지식만 들며 save 마다 origin 으로 미러된다. 팀 서버와 개인 서버가 같은 코드다.</desc>
<style>
text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.zone{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 3}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}
.purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}
.white{fill:#FFFFFF;stroke:#B4B2A9;stroke-width:0.5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="580" fill="#FFFFFF"/>

<text class="th" x="40" y="30" dominant-baseline="central" fill="#2C2C2A">MCP 한 길 — 역할이 도구를 가른다</text>

<!-- 부르는 쪽 -->
<rect class="gray" x="40" y="54" width="190" height="52" rx="8"/>
<text class="th" x="135" y="72" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">작업 레포</text>
<text class="ts" x="135" y="90" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Claude Code · writer · 스킬 셋</text>

<rect class="gray" x="245" y="54" width="190" height="52" rx="8"/>
<text class="th" x="340" y="72" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">큐레이터 폴더</text>
<text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Claude Code · 스킬 다섯</text>

<rect class="gray" x="450" y="54" width="190" height="52" rx="8"/>
<text class="th" x="545" y="72" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">브라우저</text>
<text class="ts" x="545" y="90" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">사람이 읽는다 · 콘솔</text>

<line x1="135" y1="106" x2="135" y2="150" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="143" y="128" dominant-baseline="central" fill="#5F5E5A">HTTP · Bearer 토큰</text>
<line x1="340" y1="106" x2="340" y2="150" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="128" dominant-baseline="central" fill="#5F5E5A">HTTP · Bearer 토큰</text>
<line x1="545" y1="106" x2="545" y2="150" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="553" y="128" dominant-baseline="central" fill="#5F5E5A">세션 쿠키</text>

<!-- 서버 한 프로세스 -->
<rect class="zone" x="30" y="152" width="620" height="186" rx="12"/>
<text class="ts" x="640" y="328" text-anchor="end" dominant-baseline="central" fill="#5F5E5A">ctx serve — 한 프로세스 · 한 포트</text>

<rect class="purple" x="50" y="166" width="300" height="144" rx="8"/>
<text class="th" x="66" y="188" dominant-baseline="central" fill="#3C3489">MCP  /mcp/&lt;레포&gt;</text>
<text class="ts" x="66" y="210" dominant-baseline="central" fill="#534AB7">요청마다 역할로 도구를 등록한다</text>
<text class="ts" x="66" y="234" dominant-baseline="central" fill="#3C3489">읽기 아홉 — match · where · section · work …</text>
<text class="ts" x="66" y="254" dominant-baseline="central" fill="#3C3489">save — writer 는 기록 · 큐레이터는 섹션까지</text>
<text class="ts" x="66" y="274" dominant-baseline="central" fill="#3C3489">queue · forms — 큐레이터에게만 보인다</text>
<text class="ts" x="66" y="294" dominant-baseline="central" fill="#534AB7">section 은 미반영 기록을 같이 낸다</text>

<rect class="white" x="370" y="166" width="260" height="144" rx="8"/>
<text class="th" x="386" y="188" dominant-baseline="central" fill="#2C2C2A">화면 · 관리 API</text>
<text class="ts" x="386" y="210" dominant-baseline="central" fill="#5F5E5A">/r/&lt;레포&gt;/ · /console · /manual</text>
<text class="ts" x="386" y="234" dominant-baseline="central" fill="#2C2C2A">왼쪽 메뉴는 역할로 — 보이는 것만</text>
<text class="ts" x="386" y="254" dominant-baseline="central" fill="#2C2C2A">큐레이션 › 대기열 · 이력 · 서식집</text>
<text class="ts" x="386" y="274" dominant-baseline="central" fill="#2C2C2A">서버 › 사람 · 토큰 · 레포(admin)</text>
<text class="ts" x="386" y="294" dominant-baseline="central" fill="#5F5E5A">화면은 숨기고 · 막는 것은 서버다</text>

<line x1="340" y1="338" x2="340" y2="362" class="arr" marker-end="url(#arrow)"/>

<!-- core -->
<rect class="purple" x="40" y="364" width="600" height="54" rx="8"/>
<text class="th" x="340" y="383" text-anchor="middle" dominant-baseline="central" fill="#3C3489">core/ — 판정은 한 곳</text>
<text class="ts" x="340" y="403" text-anchor="middle" dominant-baseline="central" fill="#534AB7">검사 · 대기열 · 미반영 · applied 계산 — 도구 · 화면 · CLI 가 같은 함수를 부른다</text>

<line x1="180" y1="418" x2="180" y2="442" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="418" x2="490" y2="442" class="arr" marker-end="url(#arrow)"/>

<!-- 데이터 -->
<rect class="teal" x="40" y="444" width="280" height="54" rx="8"/>
<text class="th" x="180" y="463" text-anchor="middle" dominant-baseline="central" fill="#085041">지식 레포 N — 지식만</text>
<text class="ts" x="180" y="483" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">work · docs · _vocab · _managed</text>

<rect class="white" x="340" y="444" width="300" height="54" rx="8"/>
<text class="th" x="490" y="463" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">auth.json — 명부</text>
<text class="ts" x="490" y="483" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">역할 · 레포별 큐레이터 · 토큰(해시)</text>

<line x1="180" y1="498" x2="180" y2="520" class="arr" marker-end="url(#arrow)"/>
<rect class="white" x="40" y="522" width="280" height="42" rx="8"/>
<text class="th" x="180" y="536" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">git origin</text>
<text class="ts" x="180" y="553" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">save 마다 미러 · 기계는 merge 안 함</text>

<text class="ts" x="340" y="536" dominant-baseline="central" fill="#5F5E5A">팀 서버(&lt;서버 IP&gt;:7374)와 개인 서버(127.0.0.1:7400)는</text>
<text class="ts" x="340" y="553" dominant-baseline="central" fill="#5F5E5A">같은 코드 · 같은 save · 같은 화면이다</text>
</svg>
