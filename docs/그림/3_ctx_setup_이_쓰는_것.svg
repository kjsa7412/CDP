<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img">
<title>ctx setup 이 쓰는 세 가지</title>
<desc>지식 레포의 skill 정본과 CLAUDE.md 서식을 읽어, 작업 레포에 skill 복사본과 CLAUDE.md 블록과 경로 포인터를 쓴다. 앞의 둘은 커밋하고 포인터는 커밋하지 않는다.</desc>
<style>
text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="300" fill="#FFFFFF"/>

<rect x="40" y="30" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="140" y="50" text-anchor="middle" dominant-baseline="central" fill="#085041">.claude/skills/</text>
<text class="ts" x="140" y="68" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">cdp- 7종 · 정본</text>

<rect x="40" y="106" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="140" y="126" text-anchor="middle" dominant-baseline="central" fill="#085041">work-repo/</text>
<text class="ts" x="140" y="144" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">CLAUDE.md 서식</text>

<line x1="240" y1="58" x2="262" y2="92" class="arr" marker-end="url(#arrow)"/>
<line x1="240" y1="134" x2="262" y2="120" class="arr" marker-end="url(#arrow)"/>

<rect x="270" y="78" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="98" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">ctx setup</text>
<text class="ts" x="340" y="116" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">앱 버튼도 같다</text>

<line x1="410" y1="104" x2="432" y2="58" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="112" x2="432" y2="134" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="120" x2="432" y2="205" class="arr" marker-end="url(#arrow)"/>

<rect x="440" y="30" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="540" y="50" text-anchor="middle" dominant-baseline="central" fill="#3C3489">.claude/skills/cdp-*</text>
<text class="ts" x="540" y="68" text-anchor="middle" dominant-baseline="central" fill="#534AB7">커밋한다</text>

<rect x="440" y="106" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="540" y="126" text-anchor="middle" dominant-baseline="central" fill="#3C3489">CLAUDE.md</text>
<text class="ts" x="540" y="144" text-anchor="middle" dominant-baseline="central" fill="#534AB7">cdp 블록만 · 커밋한다</text>

<rect x="440" y="182" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="540" y="202" text-anchor="middle" dominant-baseline="central" fill="#3C3489">.claude/cdp.json</text>
<text class="ts" x="540" y="220" text-anchor="middle" dominant-baseline="central" fill="#534AB7">커밋 안 함 · 경로</text>

<rect x="40" y="260" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="58" y="266" dominant-baseline="central" fill="#5F5E5A">지식 레포에서 읽는다</text>
<rect x="230" y="260" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="248" y="266" dominant-baseline="central" fill="#5F5E5A">작업 레포에 쓴다</text>
</svg>
