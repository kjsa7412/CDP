<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img">
<title>ctx 실행 경로</title>
<desc>git 훅과 사람이 껍데기를 부르고, 껍데기가 node 와 cdp.exe 중 실행기를 고르며, 둘 다 없으면 exit 127 로 훅이 건너뛴다. 어느 쪽이든 같은 core 계산을 돈다.</desc>
<style>
text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="420" fill="#FFFFFF"/>

<rect x="40" y="30" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="185" y="50" text-anchor="middle" dominant-baseline="central" fill="#444441">git 훅 pre-commit</text>
<text class="ts" x="185" y="68" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">sh bin/ctx check</text>

<rect x="350" y="30" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="495" y="50" text-anchor="middle" dominant-baseline="central" fill="#444441">사람이 직접</text>
<text class="ts" x="495" y="68" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">bin\ctx.cmd where PS002</text>

<line x1="185" y1="86" x2="185" y2="116" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="86" x2="495" y2="116" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="126" width="600" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="146" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">bin/ctx · ctx.cmd</text>
<text class="ts" x="340" y="164" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">실행기를 고른다 - 이것만 한다</text>

<line x1="133" y1="182" x2="133" y2="212" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="182" x2="340" y2="212" class="arr" marker-end="url(#arrow)"/>
<line x1="547" y1="182" x2="547" y2="212" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="222" width="186" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="133" y="242" text-anchor="middle" dominant-baseline="central" fill="#085041">node ctx.mjs</text>
<text class="ts" x="133" y="260" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">번들 단일 파일</text>

<rect x="246" y="222" width="188" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="242" text-anchor="middle" dominant-baseline="central" fill="#085041">cdp.exe ctx</text>
<text class="ts" x="340" y="260" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">SEA 가 런타임 품는다</text>

<rect x="454" y="222" width="186" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="547" y="242" text-anchor="middle" dominant-baseline="central" fill="#633806">exit 127</text>
<text class="ts" x="547" y="260" text-anchor="middle" dominant-baseline="central" fill="#854F0B">검사 실패(1)가 아니다</text>

<line x1="133" y1="278" x2="133" y2="308" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="278" x2="340" y2="308" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="318" width="600" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central" fill="#085041">core/ 계산 한 벌 - 앱도 같은 것을 쓴다</text>
<text class="ts" x="340" y="356" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">findRepo → loadRepo → 명령 함수 → exit 0 · 1 · 2</text>

<rect x="40" y="388" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="58" y="394" dominant-baseline="central" fill="#5F5E5A">지식 레포 안에서 돈다</text>
<rect x="230" y="388" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="248" y="394" dominant-baseline="central" fill="#5F5E5A">실행기 없음 - 훅은 건너뛴다</text>
</svg>
