<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img">
<title>CDP 설치 다섯 단계</title>
<desc>배포본 만들기, 반입, 지식 레포 세우기, 작업 레포에 에이전트 세팅, 팀원 clone 까지 다섯 단계와 각 단계의 명령.</desc>
<style>
text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
</style>
<rect width="680" height="400" fill="#FFFFFF"/>

<rect x="40" y="30" width="600" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="60" y="50" fill="#444441">① 배포본을 만든다</text>
<text class="ts" x="60" y="68" fill="#5F5E5A">도구 개발자 · 버전마다</text>
<text class="ts" x="620" y="50" text-anchor="end" fill="#5F5E5A">ops\release.cmd 0.5.0</text>
<text class="ts" x="620" y="68" text-anchor="end" fill="#5F5E5A">생성 knowledge-repo-dpms/</text>

<rect x="40" y="96" width="600" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="60" y="116" fill="#444441">② 반입한다</text>
<text class="ts" x="60" y="134" fill="#5F5E5A">관리자 · 폐쇄망일 때만</text>
<text class="ts" x="620" y="116" text-anchor="end" fill="#5F5E5A">폴더째 옮긴다</text>
<text class="ts" x="620" y="134" text-anchor="end" fill="#5F5E5A">CDN · 인터넷 타는 것 없음</text>

<rect x="40" y="162" width="600" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="60" y="182" fill="#085041">③ 지식 레포를 세운다</text>
<text class="ts" x="60" y="200" fill="#0F6E56">관리자 · 프로젝트당 1회</text>
<text class="ts" x="620" y="182" text-anchor="end" fill="#0F6E56">xcopy /E /I 배포본 C:\cdp</text>
<text class="ts" x="620" y="200" text-anchor="end" fill="#0F6E56">git init · core.hooksPath</text>

<rect x="40" y="228" width="600" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="60" y="248" fill="#3C3489">④ 작업 레포에 세팅한다</text>
<text class="ts" x="60" y="266" fill="#534AB7">관리자 · 레포당 1회</text>
<text class="ts" x="620" y="248" text-anchor="end" fill="#534AB7">cdp.exe ctx setup C:\gdi</text>
<text class="ts" x="620" y="266" text-anchor="end" fill="#534AB7">skill · CLAUDE.md · cdp.json</text>

<rect x="40" y="294" width="600" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="60" y="314" fill="#2C2C2A">⑤ 팀원이 clone 한다</text>
<text class="ts" x="60" y="332" fill="#5F5E5A">팀원 · 사람마다</text>
<text class="ts" x="620" y="314" text-anchor="end" fill="#5F5E5A">git clone 두 번</text>
<text class="ts" x="620" y="332" text-anchor="end" fill="#5F5E5A">hooksPath · cdp.exe · ctx setup</text>

<rect x="40" y="366" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="58" y="372" dominant-baseline="central" fill="#5F5E5A">CDP 레포 · 배포본</text>
<rect x="210" y="366" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="228" y="372" dominant-baseline="central" fill="#5F5E5A">지식 레포</text>
<rect x="330" y="366" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="348" y="372" dominant-baseline="central" fill="#5F5E5A">작업 레포</text>
</svg>
