# CI — 로컬에서 도는 것과 **같은 명령**만 부른다.
#
# 여기에만 있는 명령이 있으면 "CI 에서는 되는데 내 PC 에서는 안 된다" 가 생긴다.
# 전부 package.json 의 스크립트다 — 개발자는 같은 것을 npm run 으로 돌린다.
#
#   npm ci · build · build:site · build:ctx · test · verify
#
# 서버가 Linux 라 본선은 ubuntu 다. windows 는 번들 · 단위 테스트까지만 —
# 산출물은 릴리스(release.yml)가 만든다 — 서버 tar 와 사이트 zip 둘(v1.0).
name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ubuntu · build · test · verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # 공식 사이트 — 빌드 · 사전 생성 · 누출 검사(사내 흔적이 하나라도 있으면 실패). 캡처는 CI 에서 돌지 않는다
      - run: npm run build:site
      - run: npm run build:ctx
      - run: npm test
      # 하네스 — 설계서 §10 과 v1.0 항목을 한 자리에서. kit 은 서버가 번들(소스는 agent/)에서 내므로 fixture 에 심을 것이 없다
      - run: npm run verify
      # 취약점은 **경고**다. 실패로 두면 폐쇄망 반입 직전에 막힌다(검토 R16).
      - run: npm audit --omit=dev
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-result
          path: ops/out/verify/result.json
          if-no-files-found: ignore

  windows:
    name: windows · bundle · test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:ctx
      - run: npm test
