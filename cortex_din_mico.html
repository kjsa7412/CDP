<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);

        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.PlaneGeometry(0.8, 0.8);
        const material = new THREE.ShaderMaterial({
    uniforms: {
        uTime: { value: 0 }
    },
    vertexShader: `
        varying vec2 vUv;
        varying vec3 vColor;
        void main() {
            vUv = uv;
            vColor = instanceColor;
            vec4 mvPosition = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
        }
    `,
    fragmentShader: `
        varying vec2 vUv;
        varying vec3 vColor;
        uniform float uTime;
        void main() {
            float dist = distance(vUv, vec2(0.5));
            float ring = smoothstep(0.4, 0.45, dist) - smoothstep(0.45, 0.5, dist);
            float core = 1.0 - smoothstep(0.0, 0.1, dist);
            float alpha = core + ring * (0.5 + 0.5 * sin(uTime * 3.0));
            if (alpha < 0.05) discard;
            gl_FragColor = vec4(vColor, alpha); 
        }
    `,
    transparent: true,
    depthWrite: false,
    side: 2 // DoubleSide
});
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"radiusOuter":30,"radiusInner":15,"neuroActivity":0,"chaosFactor":0.5,"pulseSpeed":1};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime() * SPEED_MULT;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const radiusOuter = addControl("radiusOuter", "Cortical Radius", 10, 50, 30);
                 const radiusInner = addControl("radiusInner", "Deep Radius", 5, 25, 15);
                 const neuroActivity = addControl("neuroActivity", "Neuroactivity Level", 0, 1, 0.0);
                 const chaosFactor = addControl("chaosFactor", "Synaptic Chaos", 0, 2, 0.5);
                 const pulseSpeed = addControl("pulseSpeed", "Pulse Speed", 0, 5, 1.0);
                 
                 let t = time * pulseSpeed;
                 let iNorm = i / count;
                 let layer = iNorm < 0.5 ? 0 : 1;
                 let localI = layer === 0 ? i : i - (count / 2);
                 let totalLocal = count / 2;
                 
                 let phi = Math.acos(1 - 2 * (localI + 0.5) / totalLocal);
                 let theta = Math.sqrt(totalLocal * Math.PI) * (localI + 0.5);
                 
                 let r = layer === 0 ? radiusOuter : radiusInner;
                 let x = r * Math.sin(phi) * Math.cos(theta);
                 let y = r * Math.sin(phi) * Math.sin(theta);
                 let z = r * Math.cos(phi);
                 
                 let noiseX = Math.sin(t * 0.5 + phi * 3) * Math.cos(t * 0.3 + theta * 2);
                 let noiseY = Math.cos(t * 0.4 + phi * 2) * Math.sin(t * 0.6 + theta * 3);
                 let noiseZ = Math.sin(t * 0.7 + phi + theta);
                 
                 let moveAmt = layer === 0 ? chaosFactor * 1.5 : chaosFactor * 0.5;
                 x += noiseX * moveAmt;
                 y += noiseY * moveAmt;
                 z += noiseZ * moveAmt;
                 
                 let pulse = Math.sin(t * 2 + i * 0.01) * 0.05 + 1;
                 x *= pulse;
                 y *= pulse;
                 z *= pulse;
                 
                 target.set(x, y, z);
                 
                 let hStart = 0.6;
                 let s = 0.8;
                 let l = 0.5;
                 let hEnd = 0.0;
                 let hMix = neuroActivity;
                 let hFinal = hStart * (1 - hMix) + hEnd * hMix;
                 
                 let lVar = layer === 0 ? 0.5 : 0.3 + (neuroActivity * 0.4);
                 let sVar = layer === 0 ? 0.8 : 0.6 + (neuroActivity * 0.3);
                 
                 color.setHSL(hFinal, sVar, lVar);
                 
                 if (i === 0) {
                     setInfo("Neuroplasticity Brain", "Outer: Synaptic Chaos | Inner: Deep Activity");
                     annotate("core", new THREE.Vector3(0, 0, 0), "Neural Core");
                 }
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
